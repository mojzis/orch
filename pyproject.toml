[project]
name = "orch"
version = "0.1.0"
description = "orch"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "typer-agentic>=0.1.11",
]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch"]

[dependency-groups]
dev = [
    # aesop toolbox
    "madoqua",
    "gerenuk",
    "biston",
    "zorilla",
    "pycoati",
    "ty-find",
    "dermestes",
    # core
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "vulture",
    "deptry",
    "interrogate",
    "poethepoet",
    "zensical>=0.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF"]
# OrchError subclasses carry a message and a hint by design (docs/standards/code.md)
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]
"tests/fake_claude.py" = ["T201", "S603", "S607"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=orch --cov-report=term-missing -m 'not integration'"
markers = ["integration: needs a real claude and network"]

[tool.coverage.run]
source = ["orch"]

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["orch"]

[tool.deptry]

[tool.interrogate]
fail_under = 0

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # madoqua appends the staged .py files. biston reads them as --focus-args focus files
    # (only clone pairs touching a staged file); zorilla lints exactly those files.
    { name = "biston", cmd = "biston scan --focus-args", full_cmd = "biston scan .", timeout_s = 60, max_output_lines = 80 },
    { name = "zorilla", cmd = "zorilla check", timeout_s = 30, max_output_lines = 80 },
    # gerenuk scopes itself from the git diff, so no file list.
    # -o addopts= drops the --cov from [tool.pytest.ini_options]; the hook never reads coverage.
    # when = "commit": the hook only; `madoqua check` runs the full suite instead.
    { name = "gerenuk", cmd = "gerenuk run -- -q -o addopts=", pass_files = false, when = "commit", timeout_s = 120, max_output_lines = 120 },
    # `madoqua check` only (poe check):
    { name = "pytest", cmd = "pytest -q --tb=short", pass_files = false, when = "full", max_output_lines = 120 },
    { name = "pysentry", cmd = "uvx pysentry-rs .", pass_files = false, when = "full", blocking = false },
]

[tool.zorilla.rules.ZR005]
# slash-command prompts handed to claude, not paths
allowed_prefixes = ["/orch-"]

[tool.dermestes]

[tool.biston.scan]
exclude = ["**/tests/**"]

[tool.poe]
verbosity = -1

[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format --quiet ." },
    { cmd = "ruff check --fix --quiet ." },
]
help = "Auto-fix: format and lint"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Run linter (no fix)"

[tool.poe.tasks.typecheck]
cmd = "ty check"
help = "Run type checker"

[tool.poe.tasks.test]
cmd = "pytest -q --tb=short"
help = "Run tests"

[tool.poe.tasks.vulns]
shell = "uvx pysentry-rs . || true"
interpreter = "bash"
help = "Dependency vulnerability scan"

[tool.poe.tasks.test-lint]
cmd = "zorilla check ."
help = "Lint tests for smells (zorilla)"

[tool.poe.tasks.clones]
cmd = "biston scan ."
help = "Clone detection (biston)"

[tool.poe.tasks.dead-code]
cmd = "vulture orch"
help = "Dead code detection"

[tool.poe.tasks.abstractions]
cmd = "dermestes --all"
help = "Single-use abstractions (dermestes)"

[tool.poe.tasks.unused-deps]
cmd = "deptry ."
help = "Unused dependency check"

[tool.poe.tasks.check]
cmd = "madoqua check"
help = "Run all checks on every file (madoqua check): lint, types, clones, test smells, tests, vulns"

[tool.poe.tasks.check-all]
sequence = [
    { ref = "lint" },
    { ref = "typecheck" },
    { ref = "vulns" },
    { ref = "test-lint" },
    { ref = "clones" },
    { ref = "dead-code" },
    { ref = "abstractions" },
    { ref = "unused-deps" },
    { ref = "test" },
]
ignore_fail = true
help = "Run all checks (report all failures)"

[tool.poe.tasks.docs-ref]
shell = """
mkdir -p docs/site/reference
for t in setup use tune; do
  orch guide "$t" | sed '/^orch is not wired into this repo yet/d' > "docs/site/reference/$t.md"
done
"""
interpreter = "bash"
help = "Generate the docs reference pages from `orch guide`"

[tool.poe.tasks.docs]
sequence = [{ ref = "docs-ref" }, { cmd = "zensical serve" }]
help = "Serve the docs site locally with live reload"

[tool.poe.tasks.docs-build]
sequence = [{ ref = "docs-ref" }, { cmd = "zensical build --clean" }]
help = "Build the docs site into site/"

[tool.poe.tasks.setup]
cmd = "madoqua install"
help = "Install the madoqua commit hook (sets core.hooksPath)"
